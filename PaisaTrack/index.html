<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaisaTrack - Privacy-First Expense & UPI Money Manager</title>
    <meta name="description" content="Zero-database, local storage personal finance and expense tracker with smart UPI text/QR parser, custom date filtering, and private analytics." />
    <meta property="og:title" content="PaisaTrack - Privacy-First Expense & UPI Money Manager" />
    <meta property="og:description" content="Zero-database, local storage personal finance and expense tracker with smart UPI text/QR parser, custom date filtering, and private analytics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('paisatrack_theme_v1');
          if (theme !== 'light') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#09090b] text-slate-900 dark:text-zinc-100 antialiased font-sans selection:bg-indigo-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
